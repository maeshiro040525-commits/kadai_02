<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>賃上げシミュレーター</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="simulator">
    <h1>賃上げシミュレーター</h1>
    <p class="lead">保育法人向け：賃上げに必要な原資を試算します</p>

    <!-- 入力エリア：ユーザーが数字を入れる場所 -->
    <section class="input-area">
      <label>
        賃上げ額（円/月・一人あたり）
        <input type="number" id="raise-amount" value="5000">
      </label>
      <label>
        職員数（人）
        <input type="number" id="staff-count" value="18">
      </label>
      <button id="calc-btn">計算する</button>
    </section>

    <!-- 結果エリア：計算結果をJSで後から書き込む空箱（最初は「―」） -->
    <section class="result-area">
      <p>月額原資：<span id="result-monthly">―</span></p>
      <p>年額原資：<span id="result-yearly">―</span></p>
      <p>社保込み年額：<span id="result-social">―</span></p>
      <p>一人あたり年額：<span id="result-per">―</span></p>
    </section>
  </main>

  <!-- 自分で書くJS（jQueryなし＝バニラJS） -->
  <script src="js/main.js"></script>
</body>
</html>
